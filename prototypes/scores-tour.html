<title>Scores walkthrough: interactive prototype</title>

<style>
  /* ===================================================================
     Tokens, lifted verbatim from src/styles/globals.css so the prototype
     reads as the app, not as a mock of it. Dark only, on purpose: the app
     is dark only, and prototyping a light theme would be prototyping
     something that doesn't exist.
     =================================================================== */
  :root {
    color-scheme: dark;

    --bg: #111318;
    --surface: #1a1d24;
    --raised: #22262f;
    --edge: #2e333d;
    --edge-strong: #3b414d;

    --text: #e7e9ee;
    --muted: #9aa1ad;
    --faint: #6b7280;

    --accent: #f59e0b;
    --accent-hover: #d97706;
    --accent-soft: rgba(245, 158, 11, 0.14);
    --accent-fg: #111318;

    --positive: #34d399;
    --positive-soft: rgba(52, 211, 153, 0.14);
    --negative: #f43f5e;
    --negative-soft: rgba(244, 63, 94, 0.14);
    --warning: #fbbf24;

    --me: #22d3ee;
    --me-soft: rgba(34, 211, 238, 0.14);
    --me-glow: rgba(34, 211, 238, 0.25);

    --pitch-from: #1c2029;
    --pitch-to: #232833;
    --pitch-line: rgba(245, 158, 11, 0.85);

    /* Inter is served by next/font in the app; the artifact CSP blocks font
       CDNs, so this is a metric-adjacent system stack rather than a silent
       fallback from a blocked @import. */
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --phone-w: 390px;
    --phone-h: 844px;
  }

  * { box-sizing: border-box; }

  /* Several components below set `display` explicitly, which silently outranks
     the UA's `[hidden] { display: none }`; the tour's call-to-action line was
     showing on steps that had nothing to tap because of exactly that. */
  [hidden] { display: none !important; }

  body {
    margin: 0;
    background: #0a0c10;
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ===================================================================
     Page shell: phone centre stage, refinement rail beside it on desktop
     =================================================================== */
  .stage {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding: 24px 16px 40px;
  }

  .stage__head {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
  }
  .stage__title { font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; margin: 0; }
  .stage__sub { margin: 0; color: var(--faint); font-size: 0.78rem; }

  .stage__body {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: center;
    gap: 28px;
  }

  /* ---- the phone ---------------------------------------------------- */
  .phone {
    position: relative;
    width: var(--phone-w);
    height: var(--phone-h);
    max-height: calc(100dvh - 120px);
    flex: none;
    overflow: hidden;
    background: var(--bg);
    border: 10px solid #05070a;
    border-radius: 34px;
    box-shadow: 0 0 0 1px #23262d, 0 30px 70px -20px rgba(0, 0, 0, 0.9);
    /* Establishes the coordinate space every tour measurement is relative to,
       so the geometry here is the geometry the app will have. */
    isolation: isolate;
  }

  /* On a real phone the frame is noise, so go full-bleed. */
  @media (max-width: 720px) {
    .stage { padding: 0; gap: 0; }
    .stage__head { display: none; }
    .stage__body { gap: 0; }
    .phone {
      width: 100vw;
      height: 100dvh;
      max-height: none;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
  }

  .screen {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }

  /* ===================================================================
     App chrome
     =================================================================== */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 14px;
    background: rgba(26, 29, 36, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--edge);
  }
  .brand { display: flex; align-items: baseline; gap: 4px; font-weight: 800; letter-spacing: -0.02em; }
  .brand__b { color: var(--accent); font-size: 1.15rem; }
  .brand__t { font-size: 0.62rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.14em; }
  .appbar__spacer { margin-left: auto; }

  .chip-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--me);
    background: none;
    color: var(--me);
    font: inherit;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
  }
  .burger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 30px;
    border-radius: 8px;
    border: 1px solid var(--edge);
    background: none;
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
  }

  .main { padding: 16px 14px 56px; }

  /* ---- page header -------------------------------------------------- */
  .head-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }

  .gw-stepper {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid var(--edge-strong);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .gw-stepper__arrow {
    width: 30px;
    border: 0;
    background: var(--raised);
    color: var(--muted);
    font-size: 0.7rem;
    cursor: pointer;
  }
  .gw-stepper__val {
    padding: 5px 14px;
    font-size: 1.4rem;
    font-weight: 800;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .badge-live {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--negative-soft);
    color: var(--negative);
    font-size: 0.72rem;
    font-weight: 700;
  }
  .badge-live__dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--negative);
    animation: pulse-dot 1.6s ease-in-out infinite;
  }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

  .title-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .league-name { margin: 6px 0 0; color: var(--muted); font-size: 0.84rem; }

  .demo-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: none;
    margin-top: 4px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--edge-strong);
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
  }
  .demo-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- example-data banner ------------------------------------------ */
  .demo-banner {
    margin: 14px 0 0;
    padding: 8px 11px;
    border: 1px solid rgba(245, 158, 11, 0.4);
    border-radius: 9px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1.45;
  }

  /* ---- tabs --------------------------------------------------------- */
  .tabs {
    display: inline-flex;
    gap: 4px;
    margin-top: 14px;
    padding: 4px;
    border: 1px solid var(--edge);
    border-radius: 10px;
    background: var(--surface);
  }
  .tab {
    padding: 6px 14px;
    border: 0;
    border-radius: 7px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }

  /* ---- highlight control ------------------------------------------- */
  .hl-row { display: flex; justify-content: flex-end; margin-top: 14px; }
  .hl-btn {
    padding: 4px 11px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.72rem;
    font-weight: 700;
    cursor: pointer;
  }
  .hl-btn.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

  /* ---- ticker ------------------------------------------------------- */
  .sec-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 16px 0 7px;
  }
  .sec-head__title {
    display: flex; align-items: center; gap: 6px;
    margin: 0;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .sec-head__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: pulse-dot 1.6s ease-in-out infinite; }
  .sec-head__aside { font-size: 0.68rem; color: var(--faint); }
  .link-btn {
    border: 0; background: none; padding: 0;
    color: var(--accent); font: inherit; font-size: 0.7rem; font-weight: 700; cursor: pointer;
  }

  .ticker {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 8px 10px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--surface);
    scrollbar-width: none;
  }
  .ticker::-webkit-scrollbar { display: none; }

  .ev {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 6px 10px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: var(--raised);
    color: var(--text);
    font: inherit;
    font-size: 0.72rem;
    cursor: pointer;
    position: relative;
  }
  .ev[data-tone="positive"] { border-color: rgba(52, 211, 153, 0.45); background: var(--positive-soft); }
  .ev[data-tone="negative"] { border-color: rgba(244, 63, 94, 0.45); background: var(--negative-soft); }
  .ev[data-tone="warning"] { border-color: rgba(251, 191, 36, 0.45); background: rgba(251, 191, 36, 0.12); }
  .ev.is-selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .ev__who { font-weight: 700; }
  .ev__label { color: var(--muted); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .ev__pts { font-weight: 800; }
  .ev__pts.up { color: var(--positive); }
  .ev__pts.down { color: var(--negative); }
  .ev__mine { width: 6px; height: 6px; border-radius: 50%; background: var(--me); }

  /* ---- fixtures ----------------------------------------------------- */
  .fixtures {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    margin-top: 14px;
    padding-bottom: 3px;
    scrollbar-width: none;
  }
  .fixtures::-webkit-scrollbar { display: none; }
  .fx {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 6px 10px;
    border: 1px solid var(--edge);
    border-radius: 10px;
    background: none;
    color: var(--text);
    font: inherit;
    font-size: 0.73rem;
    font-weight: 700;
    cursor: pointer;
  }
  .fx.is-live { border-color: rgba(245, 158, 11, 0.6); }
  .fx.is-done { color: var(--muted); }
  .fx__score { color: var(--accent); }
  .fx__ko { font-weight: 400; color: var(--faint); }
  .fx__min { padding: 1px 5px; border-radius: 5px; background: var(--negative-soft); color: var(--negative); font-size: 0.6rem; }
  .fx__ft { font-size: 0.6rem; color: var(--faint); }

  /* ---- league table ------------------------------------------------- */
  .table-wrap {
    margin-top: 14px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    overflow: hidden;
  }
  table.lt { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  table.lt thead th {
    padding: 8px 6px;
    background: var(--raised);
    color: var(--muted);
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    text-align: left;
    white-space: nowrap;
  }
  table.lt thead th.num, table.lt tbody td.num { text-align: center; font-variant-numeric: tabular-nums; }
  table.lt tbody td { padding: 9px 6px; border-top: 1px solid var(--edge); vertical-align: middle; }
  table.lt tbody tr { cursor: pointer; }

  .rk { display: flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; }
  .mv { font-size: 0.62rem; font-weight: 700; }
  .mv.up { color: var(--positive); }
  .mv.down { color: var(--negative); }
  .mv.flat { color: var(--faint); }

  .who {
    display: block;
    border: 0; background: none; padding: 0;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .who__name { font-weight: 700; }
  .who__team { font-size: 0.68rem; color: var(--muted); }
  .pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; min-height: 15px; }
  .pill {
    padding: 1px 6px;
    border-radius: 999px;
    font-size: 0.58rem;
    font-weight: 700;
    background: var(--raised);
    color: var(--muted);
  }
  .pill--val { background: var(--positive-soft); color: var(--positive); }
  .pill--chip { background: var(--accent-soft); color: var(--accent); }
  .gwpts { font-weight: 800; font-variant-numeric: tabular-nums; }
  .hit { color: var(--negative); font-weight: 600; }
  .cap { font-size: 0.72rem; color: var(--muted); }
  .cap__vice { display: block; font-size: 0.62rem; color: var(--faint); }

  tr.is-me { background: var(--me-soft); box-shadow: inset 3px 0 0 var(--me); }
  tr.is-me .who__name { color: var(--me); }
  tr.is-dim { opacity: 0.32; }
  tr.is-match { background: rgba(245, 158, 11, 0.09); }
  .impact {
    display: inline-block;
    margin-left: 4px;
    padding: 0 4px;
    border-radius: 4px;
    font-size: 0.62rem;
    font-weight: 800;
    background: var(--positive-soft);
    color: var(--positive);
  }
  .impact.down { background: var(--negative-soft); color: var(--negative); }

  .empty-note {
    margin-top: 14px;
    padding: 12px;
    border: 1px solid var(--edge);
    border-radius: 12px;
    background: var(--surface);
    color: var(--muted);
    font-size: 0.78rem;
  }

  /* ---- form table --------------------------------------------------- */
  .form-note { margin: 12px 0 0; color: var(--faint); font-size: 0.7rem; }

  /* ===================================================================
     Sheets (the app's ui/Modal, bottom sheet on phones)
     =================================================================== */
  .sheet-scrim {
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    align-items: flex-end;
    background: rgba(0, 0, 0, 0.6);
  }
  .sheet {
    width: 100%;
    max-height: 86%;
    display: flex;
    flex-direction: column;
    border: 1px solid var(--edge);
    border-bottom: 0;
    border-radius: 18px 18px 0 0;
    background: var(--surface);
    overflow: hidden;
  }
  .sheet__head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex: none;
    padding: 16px 18px 11px;
    border-bottom: 1px solid var(--edge);
  }
  .sheet__title { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.01em; }
  .sheet__sub { display: block; margin-top: 2px; font-size: 0.74rem; font-weight: 400; color: var(--muted); }
  .sheet__x {
    flex: none;
    width: 30px; height: 30px;
    border: 0; border-radius: 8px;
    background: none;
    color: var(--muted);
    font-size: 0.95rem;
    cursor: pointer;
  }
  .sheet__x:hover { background: var(--raised); color: var(--text); }
  .sheet__body { padding: 14px 18px 22px; overflow-y: auto; }

  .field-label {
    margin: 0 0 5px;
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--raised);
    color: var(--text);
    font: inherit;
    font-size: 0.82rem;
  }
  .seg { display: flex; gap: 6px; margin-top: 8px; }
  .seg__b {
    padding: 5px 12px;
    border: 1px solid var(--edge);
    border-radius: 999px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.7rem;
    font-weight: 700;
    cursor: pointer;
  }
  .seg__b.is-on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .wide-btn {
    width: 100%;
    margin-top: 18px;
    padding: 10px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---- match sheet -------------------------------------------------- */
  .lineups { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lineups__side + .lineups__side { text-align: right; }
  .lineups h4 {
    margin: 0 0 6px;
    font-size: 0.62rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .lrow {
    display: flex;
    align-items: baseline;
    gap: 6px;
    padding: 3px 0;
    font-size: 0.76rem;
  }
  .lineups__side + .lineups__side .lrow { flex-direction: row-reverse; }
  .lrow__pos { color: var(--faint); font-size: 0.6rem; }
  .lrow__name { font-weight: 600; }
  .lrow.is-mine .lrow__name { color: var(--me); }
  .lrow__pts { margin-left: auto; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lineups__side + .lineups__side .lrow__pts { margin-left: 0; margin-right: auto; }
  .lrow__bonus { color: var(--positive); font-size: 0.62rem; font-weight: 700; }
  .subs-rule {
    margin: 7px 0 4px;
    padding-top: 6px;
    border-top: 1px solid var(--edge);
    font-size: 0.56rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--faint);
  }
  .stat-block { margin-top: 16px; }
  .stat-block h4 {
    display: flex; align-items: center; gap: 6px;
    margin: 0 0 6px;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .stat-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 10px;
    border-radius: 7px;
    background: var(--raised);
    font-size: 0.76rem;
  }
  .stat-line + .stat-line { margin-top: 4px; }
  .stat-line__v { font-weight: 800; color: var(--positive); font-variant-numeric: tabular-nums; }
  .stat-block__note { margin: 6px 0 0; font-size: 0.62rem; line-height: 1.45; color: var(--faint); }

  /* Two-column stat row: name on the outer edge, number pushed to the middle. */
  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 3px 0; font-size: 0.74rem; }
  .duo__cell { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .duo__cell--r { flex-direction: row-reverse; }
  .duo__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .duo__name.is-mine { color: var(--me); font-weight: 700; }
  .duo__name.is-hit { color: var(--positive); font-weight: 700; }
  .duo__v { margin-left: auto; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
  .duo__cell--r .duo__v { margin-left: 0; margin-right: auto; }
  .duo__v.is-hit { color: var(--positive); }
  .duo__bps { color: var(--faint); font-size: 0.62rem; }

  /* ---- profile sheet ------------------------------------------------ */
  .statboxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .statbox { padding: 11px 6px; border-radius: 9px; background: var(--raised); text-align: center; }
  .statbox__v { font-size: 1.25rem; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  .statbox__v.plain { color: var(--text); }
  .statbox__l { margin-top: 3px; font-size: 0.58rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .statbox__s { margin-top: 2px; font-size: 0.56rem; color: var(--faint); }

  .sub-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px;
    margin: 20px 0 8px;
  }
  .sub-head h4 {
    margin: 0;
    font-size: 0.66rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--muted);
  }
  .legend { display: flex; gap: 9px; font-size: 0.58rem; color: var(--faint); }
  .legend span { display: inline-flex; align-items: center; gap: 4px; }
  .legend i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

  .chip-half + .chip-half { margin-top: 11px; }
  .chip-half__t { margin: 0 0 5px; font-size: 0.6rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
  .chip-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .ctok {
    height: 42px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 8px;
    font-size: 0.8rem;
    font-weight: 800;
  }
  .ctok small { margin-top: 2px; font-size: 0.52rem; font-weight: 700; }

  function shirt(code, posId, size = 30) {
    const t = TEAMS[code] || { kit: '#555', trim: '#fff' };
    const kit = posId === 1 ? t.trim : t.kit;
    const trim = posId === 1 ? t.kit : t.trim;
    return `<svg class="plr__shirt" viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true">
      <path d="M8 2 L4 4 L2 9 L5 10 L5 21 A1 1 0 0 0 6 22 L18 22 A1 1 0 0 0 19 21 L19 10 L22 9 L20 4 L16 2 L14 4 L10 4 Z"
            fill="${kit}" stroke="rgba(0,0,0,.45)" stroke-width="0.6"/>

    </svg>`;
  }

  function movementMark(mv) {
    if (mv > 0) return `<span class="mv up">▲${mv}</span>`;

    return `<span class="mv flat">–</span>`;

    const rows = MANAGERS.map((m) => {

  // ---- sheets ---------------------------------------------------------

  function sheetShell(title, sub, anchor, bodyHTML) {
    return `
      <div class="sheet-scrim" data-tour="scrim-${anchor}">
        <section class="sheet" data-tour="sheet-${anchor}">
          <header class="sheet__head">

            <button class="sheet__x" type="button" aria-label="Close" data-tour="close-${anchor}" data-act="sheet:close">✕</button>
          </header>
          <div class="sheet__body" data-tour="body-${anchor}">${bodyHTML}</div>
        </section>
      </div>`;
  }

  function renderSheets() {
    const host = $('#sheets');
    host.innerHTML = '';
    if (!state.sheet) return;

    if (state.sheet === 'highlight') {
      host.innerHTML = sheetShell('Highlight Managers', '', 'highlight', `
        <p class="field-label">Player</p>
        <select class="select" data-tour="hl-player">
          <option>Select player…</option>
          <option selected>Haaland</option>
          <option>Salah</option>
          <option>Palmer</option>
        </select>
        <div class="seg" data-tour="hl-modes">
          <button class="seg__b is-on" type="button">Owned</button>

        </div>

          <option selected>Select club…</option>
          <option>Arsenal</option>
          <option>Liverpool</option>
        </select>
        <button class="wide-btn" type="button">Clear highlights</button>
      `);
      return;
    }

    if (state.sheet === 'match') {
      const marks = (p) => [
        p.goal ? '⚽' : '',
        p.assist ? '👟' : '',
        p.card === 'y' ? '🟨' : '',
        p.saves >= 3 ? '🧤' : '',
      ].filter(Boolean).join('');

      const lrow = (p, sub) => `
        <div class="lrow ${p.mine ? 'is-mine' : ''}">
          <span class="lrow__pos">[${p.pos}]</span>
          <span class="lrow__name">${esc(p.name)}${marks(p) ? ` <span aria-hidden="true">${marks(p)}</span>` : ''}${sub && p.on ? ` <span class="lrow__bonus">▲${p.on}'</span>` : ''}</span>
          <span class="lrow__pts">${p.pts}</span>
        </div>`;

      const side = (s) => `
        <div class="lineups__side">
          <h4>${s.code}</h4>
          ${s.starters.map((p) => lrow(p, false)).join('')}
          <p class="subs-rule">Substitutes</p>
          ${s.subs.map((p) => lrow(p, true)).join('')}
        </div>`;

      /* Two-column stat block: outer name, centre number, as the app does it. */
      const duo = (rows) => rows.map(([l, r]) => `
        <div class="duo">
          <span class="duo__cell">${l || ''}</span>
          <span class="duo__cell duo__cell--r">${r || ''}</span>
        </div>`).join('');

      const defcell = (p) => {
        if (!p) return '';
        const hit = defconHit(p);
        return `<span class="duo__name ${hit ? 'is-hit' : p.mine ? 'is-mine' : ''}">${hit ? '🔒 ' : ''}${esc(p.name)}</span><span class="duo__v">${p.defcon}</span>`;
      };
      const defRows = (() => {
        const pick = (side) => side.starters.filter((p) => p.defcon >= 4).sort((a, b) => b.defcon - a.defcon);
        const h = pick(MATCH.home), a = pick(MATCH.away);
        return Array.from({ length: Math.max(h.length, a.length) }, (_, i) => [defcell(h[i]), defcell(a[i])]);
      })();

      const savecell = (p) => {
        if (!p) return '';
        const hit = p.saves >= 3;
        return `<span class="duo__name ${hit ? 'is-hit' : p.mine ? 'is-mine' : ''}">${esc(p.name)}</span><span class="duo__v">${p.saves}</span>`;
      };
      const keepers = ['home', 'away'].map((s) => MATCH[s].starters.find((p) => p.saves > 0));

      /* Projected bonus: 3/2/1 by BPS rank, ties sharing a rank, as the app. */
      const bonusRows = (() => {
        const all = [...MATCH.home.starters, ...MATCH.away.starters].filter((p) => p.bps > 0);
        const ranks = [...new Set(all.map((p) => p.bps))].sort((x, y) => y - x).slice(0, 3);
        const award = (bps) => [3, 2, 1][ranks.indexOf(bps)] ?? 0;
        const top = all.filter((p) => award(p.bps) > 0).sort((x, y) => y.bps - x.bps);
        const homeSide = top.filter((p) => MATCH.home.starters.includes(p));
        const awaySide = top.filter((p) => MATCH.away.starters.includes(p));
        const cell = (p) => p
          ? `<span class="duo__name ${p.mine ? 'is-mine' : ''}">${esc(p.name)} <span class="duo__bps">[${p.bps} BPS]</span></span><span class="duo__v is-hit">+${award(p.bps)}</span>`
          : '';
        return Array.from({ length: Math.max(homeSide.length, awaySide.length) }, (_, i) => [cell(homeSide[i]), cell(awaySide[i])]);
      })();

      host.innerHTML = sheetShell(
        `LIV <span style="color:var(--accent)">2–1</span> MCI`,
        `67' &middot; your players in teal`,
        'match',
        `
        <div class="lineups" data-tour="match-lineups">${side(MATCH.home)}${side(MATCH.away)}</div>

        <div class="stat-block" data-tour="match-defcon">
          <h4><span aria-hidden="true">🛡️</span>Defensive contribution</h4>
          ${duo(defRows)}
          <p class="stat-block__note">Locked rows have hit the threshold and scored: 10 for defenders and keepers, 12 for everyone else.</p>
        </div>

        <div class="stat-block" data-tour="match-saves">
          <h4><span aria-hidden="true">🧤</span>Keeper saves</h4>
          ${duo([[savecell(keepers[0]), savecell(keepers[1])]])}
          <p class="stat-block__note">A point for every three saves.</p>
        </div>

        <div class="stat-block" data-tour="match-bonus">
          <h4><span aria-hidden="true">⭐</span>Projected bonus</h4>
          ${duo(bonusRows)}
          <p class="stat-block__note">Projected from BPS as it stands, so it can still move before the gameweek is confirmed.</p>
        </div>
      `);
      return;
    }

    if (state.sheet === 'profile') {
      const r = PROFILE.records;
      const chipRow = (half, title, lockGw) => {
        const codes = [['wildcard', 'WC'], ['freehit', 'FH'], ['bboost', 'BB'], ['3xc', 'TC'], ['manager', 'AM']];
        return `

      };

      host.innerHTML = sheetShell('You', 'Your Team', 'profile', `
        <div class="statboxes" data-tour="profile-stats">
          <div class="statbox"><div class="statbox__v">#${r.currentRank}</div><div class="statbox__l">League rank</div><div class="statbox__s">best: #${r.bestRank}</div></div>

          <div class="statbox"><div class="statbox__v">${PROFILE.motmWins}</div><div class="statbox__l">MotM wins</div></div>
        </div>

        <div class="sub-head">
          <h4>Chips</h4>
          <span class="legend">
            <span><i style="background:var(--positive)"></i>Available</span>
            <span><i style="background:var(--edge-strong)"></i>Used</span>
            <span><i style="background:var(--negative)"></i>Expired</span>
          </span>
        </div>
        <div data-tour="profile-chips">
          ${chipRow(PROFILE.chips.firstHalf, 'Gameweeks 1–19', 20)}
          ${chipRow(PROFILE.chips.secondHalf, 'Gameweeks 20–38', 20)}
        </div>

        <div class="sub-head"><h4>League rank history</h4></div>
        <div data-tour="profile-chart">${rankChart(PROFILE.history)}</div>

        <div class="sub-head"><h4>Season records</h4></div>
        <ul class="kv" data-tour="profile-records">
          <li><span class="kv__k">Best GW</span><span class="kv__v pos">${r.highestGW.points} pts <small>(GW${r.highestGW.gw})</small></span></li>
          <li><span class="kv__k">Worst GW</span><span class="kv__v neg">${r.lowestGW.points} pts <small>(GW${r.lowestGW.gw})</small></span></li>
          <li><span class="kv__k">Weekly loser</span><span class="kv__v neg">${PROFILE.loserCount}×</span></li>
        </ul>

        <div class="sub-head"><h4>Transfers</h4></div>
        <ul class="kv" data-tour="profile-transfers">
          <li><span class="kv__k">Total made</span><span class="kv__v">${r.totalTransfers}</span></li>
          <li><span class="kv__k">Point hits</span><span class="kv__v neg">-${r.transferHits} pts</span></li>
        </ul>
      `);
      return;
    }

    if (state.sheet === 'pitch') {
      const tile = (p) => `
        <button class="plr ${p.subOut ? 'is-out' : ''}" type="button"
                data-tour="${p.key ? 'plr-key' : 'plr-' + p.n.toLowerCase()}" ${p.key ? 'data-act="player:open"' : ''}>
          ${p.captain ? '<span class="plr__c">C</span>' : ''}

      const bucket = (label, total, rows) => `
        <div class="mline"><span>${label}</span><span class="mline__pts ${total >= 0 ? 'pos' : 'neg'}" style="color:${total >= 0 ? 'var(--positive)' : 'var(--negative)'}">${total >= 0 ? '+' : ''}${total}</span></div>
        ${rows.map((r) => `<div class="msub"><span>${esc(r.label)}</span><span class="mline__pts">${r.d >= 0 ? '+' : ''}${r.d}</span></div>`).join('')}`;

      host.innerHTML = sheetShell('You', 'GW21 · Your Team', 'pitch', `
        <div class="gw-summary" data-tour="pitch-summary">
          <span>GW points <strong>${SQUAD.gwPoints}</strong> <span class="hit">(−${SQUAD.hit} hit)</span></span>
          <span>On bench <strong>${SQUAD.bench}</strong></span>

          ${SQUAD.rows.map((row) => `<div class="pitch__row">${row.map(tile).join('')}</div>`).join('')}
          <div class="bench-head" data-tour="pitch-bench"><span>Substitutes</span><span>${SQUAD.bench} pts</span></div>
          <div class="pitch__row">${SQUAD.benchRow.map(tile).join('')}</div>
        </div>

        <div class="moves" data-tour="moves">
          <button class="moves__toggle" type="button" data-tour="moves-toggle" data-act="moves:toggle">
            <span>🔧 Your moves</span>

            <div class="moves__body" data-tour="moves-body">

              ${bucket('Captaincy', MOVES.captaincy.total, [{ label: `Armband: ${MOVES.captaincy.from} → ${MOVES.captaincy.to}`, d: 4 }])}

              <div class="mline"><span>Transfer hits</span><span class="mline__pts" style="color:var(--negative)">−${MOVES.hit}</span></div>
              <div class="mline mline--total"><span>Your score</span><span class="mline__pts">${MOVES.net} pts <span style="color:var(--positive)">(+${MOVES.impact})</span></span></div>

        host.insertAdjacentHTML('beforeend', sheetShell(

          `${b.team} · ${b.pos} · captain (×${b.multiplier})`,
          'player',
          `
          <div class="brk" data-tour="player-rows">
            ${b.rows.map((r) => `
              <div class="brk__row">
                <span class="brk__l"><span aria-hidden="true">${r.icon}</span>${esc(r.stat)}</span>
                <span class="brk__r"><span class="brk__v">${r.v}</span><span class="brk__p ${r.p < 0 ? 'neg' : ''}">${r.p} pts</span></span>
              </div>`).join('')}

        // Tag the player sheet's close button distinctly from the pitch's.
        const last = host.lastElementChild;
        $('[data-tour="close-player"]', last).dataset.act = 'player:close';
      }
      return;

  /** Rank history: inverted axis (rank 1 at the top), emphasised endpoint. */
  function rankChart(history) {
    const w = 320, h = 116, padL = 22, padR = 8, padT = 10, padB = 18;
    const max = Math.max(...history), min = Math.min(...history);
    const x = (i) => padL + (i / (history.length - 1)) * (w - padL - padR);
    const y = (v) => padT + ((v - min) / Math.max(1, max - min)) * (h - padT - padB);
    const pts = history.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const lastX = x(history.length - 1), lastY = y(history[history.length - 1]);
    const grid = [min, Math.round((min + max) / 2), max].map((v) => `
      <line x1="${padL}" y1="${y(v)}" x2="${w - padR}" y2="${y(v)}" stroke="var(--edge)" stroke-width="1"/>
      <text x="${padL - 5}" y="${y(v) + 3}" text-anchor="end" fill="var(--faint)" font-size="8">${v}</text>`).join('');

    return `
      <svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="League rank by gameweek, rank 1 at the top. Currently 2nd.">
        ${grid}
        <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="3.5" fill="var(--accent)"/>
        <circle cx="${lastX}" cy="${lastY}" r="7" fill="none" stroke="var(--accent)" stroke-opacity=".35"/>
      </svg>
      <p class="chart__cap">Rank 1 at the top · GW1–21</p>`;
  }

  // =====================================================================
  // Page interactions, only reachable when the tour allows the click.

  $('#phone').addEventListener('click', (e) => {
    const acted = e.target.closest('[data-act]');
    if (!acted) return;
    const [kind, value] = acted.dataset.act.split(':');

    if (kind === 'view') state.view = value;
    else if (kind === 'sheet' && value === 'close') { state.sheet = null; state.playerOpen = false; state.movesOpen = false; }
    else if (kind === 'sheet') state.sheet = value;
    else if (kind === 'pin' && value === 'clear') state.pinnedEvent = null;
    else if (kind === 'pin') state.pinnedEvent = Number(value);
    else if (kind === 'player' && value === 'open') state.playerOpen = true;
    else if (kind === 'player' && value === 'close') state.playerOpen = false;
    else if (kind === 'moves') state.movesOpen = !state.movesOpen;

    render();
    tour.onPageClick(acted);
  });

  // =====================================================================
  // Tour engine
  //
  // Two things make this different from the first cut:
  //
  // 1. Advancing is doing. A step with `tap` is completed by tapping the real
  //    control, not a Next button. Every other click is swallowed in the
  //    capture phase and nudges the gold box, so the tour cannot be
  //    click-raced out of sync, and nothing is learned by pressing Next.
  // 2. Fitting is guaranteed. The card takes the edge that leaves the most
  //    room, and the screen is then scrolled so the target sits inside the
  //    band the card doesn't cover. If the target still can't fit, the card
  //    yields; it shrinks its own copy rather than hiding the subject.
  // =====================================================================

  /** `tap` = must tap this anchor to advance. `look` = read and press Next. */
  const STEPS = [
    { id: 'welcome', title: 'Welcome to Scores', body: "The busiest page on the site: live points for the whole league, and a way into everyone's team. It's filled with example data so you can see all of it working, even before a ball is kicked.", cta: 'Start' },

    { id: 'moves-body', at: 'moves-body', title: 'Your moves, judged', body: 'Last week\'s team as a baseline, then transfers, captaincy and bench calls each given a number, minus the hit. The total says whether the meddling paid.', leave: 'sheet:close' },
    { id: 'done', title: 'That is Scores', body: 'The example league goes away now and your own comes back. Everything else on the site hangs off the menu, top right, and See demo replays this any time.', cta: 'Finish' },
  ];

  const tour = (() => {
    const root = $('#tour');
    const mask = $('#tourMask');
    const card = $('#tourCard');
    const phone = $('#phone');
    const screen = $('#screen');

    let i = -1;
    let active = false;
    let gate = true;

    const CARD_MARGIN = 10;
    const SPOT_PAD = 6;
    /** Breathing room kept between the target and the edges of its band. */
    const CLEARANCE = 14;

    function stepAt(n) { return STEPS[n]; }

    function anchorEl(step) {
      if (!step || !step.at) return null;
      const node = phone.querySelector(`[data-tour="${step.at}"]`);
      if (!node) return null;
      const r = node.getBoundingClientRect();
      return r.width > 0 && r.height > 0 ? node : null;
    }

    /** Nearest ancestor that actually scrolls: the screen, or a sheet body. */
    function scrollParent(node) {
      let p = node.parentElement;
      while (p && p !== phone) {
        const oy = getComputedStyle(p).overflowY;
        if ((oy === 'auto' || oy === 'scroll') && p.scrollHeight > p.clientHeight + 1) return p;
        p = p.parentElement;
      }
      return screen;
    }

    /**
     * Put the target inside the band the card does not cover, moving the card
     * to whichever edge leaves more room and scrolling the container to suit.
     * Returns the edge the card should take.
     *
     * `centre` is set for every step you have to tap. Merely dragging the
     * target into view is not good enough for those: a button sitting one pixel
     * inside the bottom edge is easy to miss and annoying to hit, which is
     * exactly what happened to the tinkering panel at the foot of the pitch
     * sheet. Anything you are asked to tap gets pulled to the middle.
     */
    function fit(node, { centre = false } = {}) {
      const pr = phone.getBoundingClientRect();
      const tr = node.getBoundingClientRect();

      const cardH = card.offsetHeight || 150;
      const spaceAbove = tr.top - pr.top;
      const spaceBelow = pr.bottom - tr.bottom;
      // The card sits where there is more slack; ties go to the bottom, which
      // is where a thumb already is.
      const edge = spaceAbove > spaceBelow + 24 ? 'top' : 'bottom';

      const bandTop = pr.top + (edge === 'top' ? cardH + CARD_MARGIN : 0);
      const bandBottom = pr.bottom - (edge === 'bottom' ? cardH + CARD_MARGIN : 0);

      const sp = scrollParent(node);
      const spr = sp.getBoundingClientRect();
      // Only the part of the band the scroll container can actually reach.
      const reachTop = Math.max(bandTop, spr.top) + CLEARANCE;
      const reachBottom = Math.min(bandBottom, spr.bottom) - CLEARANCE;
      const reach = reachBottom - reachTop;

      const wantCentre = (reachTop + reachBottom) / 2;
      const isCentre = tr.top + tr.height / 2;

      let delta = 0;
      if (tr.height >= reach) {
        delta = tr.top - reachTop;                        // too tall: align tops
      } else if (centre) {
        delta = isCentre - wantCentre;                    // tap target: dead centre
      } else if (tr.top < reachTop) {
        delta = tr.top - reachTop;                        // hidden above
      } else if (tr.bottom > reachBottom) {
        delta = tr.bottom - reachBottom;                  // hidden below
      } else if (Math.abs(isCentre - wantCentre) > reach * 0.28) {
        delta = isCentre - wantCentre;                    // drifted to an edge
      }

      if (Math.abs(delta) > 0.5) sp.scrollTop += delta;
      return edge;
    }

    function paintSpot(node) {
      mask.innerHTML = '';
      if (!node) {
        mask.appendChild(el('div', 'tour__dim'));
        return null;
      }
      const pr = phone.getBoundingClientRect();
      const tr = node.getBoundingClientRect();
      const spot = el('div', 'tour__spot');
      spot.style.top = `${tr.top - pr.top - SPOT_PAD}px`;
      spot.style.left = `${Math.max(2, tr.left - pr.left - SPOT_PAD)}px`;
      spot.style.width = `${Math.min(pr.width - 4, tr.width + SPOT_PAD * 2)}px`;
      spot.style.height = `${tr.height + SPOT_PAD * 2}px`;
      mask.appendChild(spot);
      return spot;
    }

    function show() {
      const step = stepAt(i);
      if (!step) return;

      $('#tourCount').innerHTML = `Step ${i + 1} of ${STEPS.length}${state.demo ? '<span class="tour__tag">Example data</span>' : ''}`;
      $('#tourTitle').textContent = step.title;
      const bodyNode = $('#tourBody');
      bodyNode.textContent = step.body || '';
      bodyNode.hidden = !step.body;

      const mustTap = Boolean(step.tap) && gate;
      const cta = $('#tourCta');
      if (mustTap && step.cta) {
        $('#tourCtaText').textContent = step.cta;
        cta.hidden = false;
      } else {
        cta.hidden = true;
      }

      const next = $('#tourNext');
      next.hidden = mustTap;
      next.textContent = step.cta && !step.tap ? step.cta : (i === STEPS.length - 1 ? 'Done' : 'Next');

      const prog = $('#tourProg');
      prog.innerHTML = STEPS.map((_, n) => `<i class="${n <= i ? 'done' : ''}"></i>`).join('');

      const node = anchorEl(step);
      // Measure the card before fitting: its height decides the band.
      card.dataset.edge = node ? 'bottom' : 'center';
      const edge = node ? fit(node, { centre: mustTap }) : 'center';
      card.dataset.edge = edge;
      paintSpot(node);

      // A second pass: scrolling may have changed the rect, and the edge choice
      // may have changed the card height (copy wraps differently at the top).
      requestAnimationFrame(() => {
        if (!active || stepAt(i) !== step) return;
        const n2 = anchorEl(step);
        if (n2) {
          card.dataset.edge = fit(n2, { centre: mustTap });
          paintSpot(n2);
        }
      });

      syncRail();
    }

    function nudge() {
      const spot = mask.querySelector('.tour__spot');
      if (!spot) return;
      spot.classList.remove('tour__spot--nudge');
      void spot.offsetWidth;
      spot.classList.add('tour__spot--nudge');
    }

    /**
     * Advance, running the outgoing step's `leave` housekeeping first.
     *
     * `leave` exists so the tour can tidy up after itself, closing a sheet it
     * opened, without spending a whole step on "now tap ✕". Closing is taught
     * once, on the first sheet; after that the tour just does it, which is what
     * the reader would want by then.
     */
    function go(n, dir = 1) {
      if (n < 0) return;
      const from = stepAt(i);
      if (from && from.leave && dir === 1) {
        applyAct(from.leave);
        render();
      }
      if (n >= STEPS.length) { quit(); return; }
      i = n;
      show();
    }

    function start() {
      active = true;
      document.body.classList.add('is-touring');
      state.demo = true;
      state.view = 'scores';
      state.sheet = null;
      state.playerOpen = false;
      state.movesOpen = false;
      state.pinnedEvent = null;
      render();
      root.hidden = false;
      go(0);
    }

    function quit() {
      active = false;
      document.body.classList.remove('is-touring');
      root.hidden = true;
      state.demo = false;
      state.sheet = null;
      state.playerOpen = false;
      state.movesOpen = false;
      state.pinnedEvent = null;
      state.view = 'scores';
      i = -1;
      render();
      syncRail();
    }

    /**
     * Click gate. Runs in the capture phase on the phone, so it decides before
     * any page handler sees the event: taps land only on the step's own anchor
     * (or inside the tour card). Everything else is swallowed and nudged.
     */
    function gateClick(e) {
      if (!active) return;
      if (card.contains(e.target)) return;

      const step = stepAt(i);
      const node = step ? anchorEl(step) : null;
      const wants = Boolean(step && step.tap) && gate && node;

      if (wants && (node.contains(e.target) || e.target === node)) return;  // allowed through

      e.preventDefault();
      e.stopPropagation();
      if (e.type === 'click') nudge();
    }
    ['pointerdown', 'mousedown', 'touchstart', 'click'].forEach((t) => {
      phone.addEventListener(t, gateClick, true);
    });

    /** A permitted tap landed and the page re-rendered, so advance. */
    function onPageClick() {
      if (!active) return;
      const step = stepAt(i);
      if (step && step.tap) go(i + 1);
    }

    $('#tourNext').addEventListener('click', () => go(i + 1));
    $('#tourQuit').addEventListener('click', quit);

    /**
     * Keys that scroll, or move focus off the card onto something the click
     * gate is protecting. The engine owns the scroll position while a tour
     * runs, so they do nothing.
     */
    const INERT_KEYS = new Set(['Tab', ' ', 'PageUp', 'PageDown', 'Home', 'End', 'ArrowUp', 'ArrowDown', 'ArrowLeft']);

    window.addEventListener('keydown', (e) => {
      if (!active) return;
      if (e.key === 'Escape') { quit(); return; }
      const step = stepAt(i);
      const mustTap = Boolean(step && step.tap) && gate;
      if ((e.key === 'ArrowRight' || e.key === 'Enter') && !mustTap) { e.preventDefault(); go(i + 1); }
      else if (INERT_KEYS.has(e.key)) e.preventDefault();
    }, true);

    /**
     * Scroll lock. The gold box is positioned in viewport coordinates and fit()
     * has already put the subject in the band the card leaves free, so a scroll
     * the engine did not perform slides the subject out from under its own
     * outline. Cancelling wheel and touchmove rather than setting
     * overflow: hidden keeps the engine's own scrollTop writes working, and
     * both need an explicit passive: false or preventDefault is ignored.
     */
    const blockScroll = (e) => {
      if (!active) return;
      if (card.contains(e.target)) return;
      e.preventDefault();
    };
    ['wheel', 'touchmove'].forEach((t) => phone.addEventListener(t, blockScroll, { capture: true, passive: false }));

    let raf = 0;
    function reposition() {
      if (!active) return;
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(() => {
        const step = stepAt(i);
        const node = step ? anchorEl(step) : null;
        paintSpot(node);
      });
    }
    screen.addEventListener('scroll', reposition, { passive: true });
    window.addEventListener('resize', () => { if (active) show(); });

    // ---- refinement rail ---------------------------------------------
    function syncRail() {
      const list = $('#railSteps');
      if (!list.childElementCount) {
        list.innerHTML = STEPS.map((s, n) => `
          <button class="rail__step" type="button" data-step="${n}">
            <b>${String(n + 1).padStart(2, '0')}</b>
            <span>${esc(s.title)}</span>
            <i>${s.tap ? 'tap' : 'look'}</i>
          </button>`).join('');
        list.addEventListener('click', (e) => {
          const b = e.target.closest('[data-step]');
          if (!b) return;
          jumpTo(Number(b.dataset.step));
        });
      }
      [...list.children].forEach((b, n) => b.classList.toggle('is-current', active && n === i));
      const cur = list.children[i];
      if (active && cur) cur.scrollIntoView({ block: 'nearest' });
    }

    /**
     * Jump straight to a step for review. Tap steps leave the page in a
     * particular state, so replay the side effects of everything before it
     * rather than trying to guess.
     */
    function jumpTo(n) {
      active = true;
      document.body.classList.add('is-touring');
      root.hidden = false;
      state.demo = true;
      state.view = 'scores';
      state.sheet = null;
      state.playerOpen = false;
      state.movesOpen = false;
      state.pinnedEvent = null;

      for (let k = 0; k < n; k++) {
        const s = STEPS[k];
        if (s.tap) {
          const node = phone.querySelector(`[data-tour="${s.at}"]`);
          const act = node && node.dataset.act;
          // The anchor may not exist yet (it lives inside a sheet an earlier
          // step opens); fall back to the effect the step is known to have.
          if (act) applyAct(act); else applyKnownEffect(s);
          render();
        }
        if (s.leave) { applyAct(s.leave); render(); }
      }
      render();
      i = n;
      show();
    }

    function applyAct(act) {
      const [kind, value] = act.split(':');
      if (kind === 'view') state.view = value;
      else if (kind === 'sheet' && value === 'close') { state.sheet = null; state.playerOpen = false; state.movesOpen = false; }
      else if (kind === 'sheet') state.sheet = value;
      else if (kind === 'pin' && value === 'clear') state.pinnedEvent = null;
      else if (kind === 'pin') state.pinnedEvent = Number(value);
      else if (kind === 'player' && value === 'open') state.playerOpen = true;
      else if (kind === 'player' && value === 'close') state.playerOpen = false;
      else if (kind === 'moves') state.movesOpen = !state.movesOpen;
    }

    const KNOWN = {
      'hl-close': 'sheet:close',
      'match-close': 'sheet:close',
      'profile-close': 'sheet:close',
      'player-close': 'player:close',
      'pitch-close': 'sheet:close',
      'moves-open': 'moves:toggle',
      'player-open': 'player:open',
      'ev-clear': 'pin:clear',
    };
    function applyKnownEffect(step) {
      const act = KNOWN[step.id];
      if (act) applyAct(act);
    }

    $('#railRestart').addEventListener('click', start);
    $('#railPrev').addEventListener('click', () => { if (active) jumpTo(Math.max(0, i - 1)); });
    $('#railNext').addEventListener('click', () => { if (active) jumpTo(Math.min(STEPS.length - 1, i + 1)); });
    $('#railGate').addEventListener('change', (e) => { gate = e.target.checked; if (active) show(); });
    $('#railTargets').addEventListener('change', (e) => {
      document.body.classList.toggle('show-targets', e.target.checked);
    });

    return { start, quit, reposition, onPageClick, jumpTo, syncRail, get active() { return active; } };
  })();

  // The See demo button is the real trigger in the app, so it is the trigger
  // here too, reachable whenever the tour is not running.
  $('#phone').addEventListener('click', (e) => {
    if (tour.active) return;
    if (e.target.closest('[data-tour="demo-btn"]')) tour.start();
  });

  render();
  tour.syncRail();
  // Auto-offer, exactly as a first visit would.
  setTimeout(() => tour.start(), 450);
})();
</script>
