services:
  - type: web
    name: fpl-dashboard
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # Release the Team Planner (fixtures, FDR, price predictions). Read at
      # build time (NEXT_PUBLIC_*), so a rebuild is required to take effect.
      - key: NEXT_PUBLIC_PLANNER_ENABLED
        value: 'true'
